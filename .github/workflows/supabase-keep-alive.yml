name: Supabase Keep Alive

on:
  schedule:
    # GitHub Actions uses UTC. Run every 3 days at 04:00 UTC.
    - cron: '0 4 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Supabase client
        run: npm install --no-save --ignore-scripts @supabase/supabase-js@2.43.2

      - name: Check Supabase environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || secrets.VUE_APP_SUPABASE_URL || vars.VUE_APP_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || secrets.VUE_APP_SUPABASE_ANON_KEY || vars.VUE_APP_SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL is empty"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "SUPABASE_ANON_KEY is empty"; exit 1; }
          echo "Supabase environment variables are available"

      - name: Run read-only query
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || secrets.VUE_APP_SUPABASE_URL || vars.VUE_APP_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || secrets.VUE_APP_SUPABASE_ANON_KEY || vars.VUE_APP_SUPABASE_ANON_KEY }}
          VUE_APP_SUPABASE_URL: ${{ secrets.VUE_APP_SUPABASE_URL || vars.VUE_APP_SUPABASE_URL || secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          VUE_APP_SUPABASE_ANON_KEY: ${{ secrets.VUE_APP_SUPABASE_ANON_KEY || vars.VUE_APP_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: node cron/supabase.js
