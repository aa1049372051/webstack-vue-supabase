name: webstack Actions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Build Site
        env:
          VUE_APP_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VUE_APP_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VUE_APP_BUCKET_NAME: ${{ secrets.SUPABASE_BUCKET_NAME }}
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider
          node -v
          yarn config set ignore-engines true
          yarn
          yarn build

      - name: Deploy Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: aa1049372051/webstack-vue-supabase
          personal_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          full_commit_message: ${{ github.event.head_commit.message }}
